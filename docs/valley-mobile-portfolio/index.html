 else if(a==='create-portfolio'){const input=document.getElementById('pf-name');const err=document.getElementById('pf-name-error');const name=input.value.trim();if(!name){err.textContent='포트폴리오 이름을 입력해 주세요.';return}const id='p'+(data.portfolios.length+1);data.portfolios.push({id,name,daily:0,profit:0,profitRate:0,holdings:[]});current.portfolioId=id;nav=[];current.screen='F07';render({scroll:'top'})}
 else if(a==='select-asset'){selectedAssetId=el.dataset.id;const asset=assetCatalog.find(x=>x.id===selectedAssetId);document.getElementById('selected-asset').innerHTML=`<div class="selected-asset"><strong>${asset.name}</strong><div class="section-caption">${asset.ticker} · 현재가 ${fmtKRW(asset.price)}</div></div>`;document.getElementById('add-qty').disabled=false;document.getElementById('add-avg').disabled=false;}
 else if(a==='add-holding'){const p=data.portfolios.find(x=>x.id===current.portfolioId);const asset=assetCatalog.find(x=>x.id===selectedAssetId);const qty=validNumber('add-qty'),avg=validNumber('add-avg');document.getElementById('add-qty-error').textContent=!asset?'먼저 종목을 선택해 주세요.':(!qty||qty<=0?'신규 Holding의 보유 수량은 0보다 커야 합니다.':'');document.getElementById('add-avg-error').textContent=!asset?'':(!avg||avg<=0?'평균단가는 0보다 커야 합니다.':'');if(!asset||!qty||qty<=0||!avg||avg<=0)return;const h={...asset,qty,avg,value:asset.price*qty,profit:(asset.price-avg)*qty,profitRate:(asset.price-avg)/avg*100,daily:0};p.holdings.push(h);current.screen='F08';nav=[];render({scroll:'top'})}
 else if(a==='save-holding'){const p=data.portfolios.find(x=>x.id===current.portfolioId);const h=p?.holdings.find(x=>x.id===current.holdingId);const qty=validNumber('edit-qty'),avg=validNumber('edit-avg');document.getElementById('edit-avg-error').textContent=(!avg||avg<=0)?'평균단가는 0보다 커야 합니다.':'';if(Number.isNaN(qty)||qty<0){document.getElementById('edit-qty-error').textContent='보유 수량은 0 이상이어야 합니다.';return}else document.getElementById('edit-qty-error').textContent='';if(!avg||avg<=0)return;h.qty=qty;if(h.country==='미국'&&h.localPrice&&h.priceBasis==='KRW_NORMALIZED'){h.localAvg=avg;h.avg=avg*REFERENCE_FIXTURE_USD_KRW;h.value=h.price*qty;h.profit=(h.price-h.avg)*qty;h.profitRate=(h.price-h.avg)/h.avg*100}else{h.avg=avg;h.value=h.price*qty;h.profit=(h.price-avg)*qty;h.profitRate=(h.price-avg)/avg*100;}nav=[];current.scope=[...new Set([...current.scope,p.id])];current.screen='F04';render({scroll:'top'})}
 else if(a==='retry'){fixture='normal';render()}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-action="holdings-sort"]')){current.holdingSort=e.target.value;render()}});
function refocusRenderedTab(snapshot){setTimeout(()=>{const tabs=[...document.querySelectorAll('[role="tab"]')];const found=tabs.find(x=>x.dataset.action===snapshot.action&&((snapshot.target&&x.dataset.target===snapshot.target)||(snapshot.lens&&x.dataset.lens===snapshot.lens)||(snapshot.filter&&x.dataset.filter===snapshot.filter)||(snapshot.mode&&x.dataset.mode===snapshot.mode)));found?.focus({preventScroll:true})},0);}
function tabSnapshot(el){return {action:el.dataset.action,target:el.dataset.target,lens:el.dataset.lens,filter:el.dataset.filter,mode:el.dataset.mode};}
document.addEventListener('keydown',e=>{
 const currencyTrigger=e.target.closest?.('[data-action="currency-toggle"]');
 if(currencyTrigger&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();if(!currencyMenuOpen){currencyMenuOpen=true;render()}setTimeout(()=>{const opts=[...document.querySelectorAll('.currency-option')];const selected=opts.findIndex(x=>x.getAttribute('aria-selected')==='true');const idx=e.key==='ArrowUp'?(selected>0?selected-1:opts.length-1):(selected>=0&&selected<opts.length-1?selected+1:0);opts[idx]?.focus()},0);return}
 const currencyOption=e.target.closest?.('[data-action="currency-option"]');
 if(currencyOption&&(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Home'||e.key==='End')){const opts=[...document.querySelectorAll('.currency-option')];const i=opts.indexOf(currencyOption);let next=i;if(e.key==='ArrowDown')next=(i+1)%opts.length;if(e.key==='ArrowUp')next=(i-1+opts.length)%opts.length;if(e.key==='Home')next=0;if(e.key==='End')next=opts.length-1;e.preventDefault();opts[next]?.focus();return}
 if(!document.querySelector('.sheet')&&currencyMenuOpen&&e.key==='Escape'){e.preventDefault();currencyMenuOpen=false;render();setTimeout(()=>document.querySelector('[data-action="currency-toggle"]')?.focus({preventScroll:true}),0);return}
 const sheet=document.querySelector('.sheet');if(sheet){if(e.key==='Escape'){e.preventDefault();if(portfolioPickerOpen)closePortfolioPicker();else closeScope();return}if(e.key==='Tab'){const f=sheetFocusable();if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}}
 const tab=e.target.closest?.('[role="tab"]');if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Home'||e.key==='End')){const tablist=tab.closest('[role="tablist"]');if(!tablist)return;const tabs=[...tablist.querySelectorAll('[role="tab"]')].filter(x=>!x.disabled);const i=tabs.indexOf(tab);let idx=i;if(e.key==='ArrowRight')idx=(i+1)%tabs.length;if(e.key==='ArrowLeft')idx=(i-1+tabs.length)%tabs.length;if(e.key==='Home')idx=0;if(e.key==='End')idx=tabs.length-1;const next=tabs[idx];const snapshot=tabSnapshot(next);e.preventDefault();next.click();refocusRenderedTab(snapshot)}});
render({scroll:'top'});

// currency-menu-outside-close
document.addEventListener('click',e=>{if(currencyMenuOpen&&!e.target.closest('.currency-dropdown')&&!e.target.closest('[data-action="currency-toggle"]')){currencyMenuOpen=false;render();}});

</script></body></html>
